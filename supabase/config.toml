# Local Supabase stack for the real-database integration tests
# (backend/tests/db, `npm run test:db`). Only the database, PostgREST and
# GoTrue (behind the API gateway) are started; see
# docs/adr/0008-real-database-integration-tests.md.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "trackit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Must match the hosted project (`SHOW server_version;`).
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
# supabase/migrations holds symlinks to the SQL files at the repository root,
# applied in the same order as docs/DEPLOYMENT.md.
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Test users sign in straight away.
enable_confirmations = false

# Not needed by the API, so not started.
[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
