name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, format, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Check root and backend dependencies match
        run: node ../scripts/check-deps-sync.js
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high && (cd .. && npm audit --omit=dev --audit-level=high)
      - run: npm run lint
      - run: npm run format:check
      - name: Test with coverage
        run: npm run test:coverage -- --coverageReporters=text --coverageReporters=json-summary
        env:
          NODE_ENV: test
      - name: Evaluation harness self-check (oracle, no API calls)
        run: npm run eval -- --oracle
      - name: Publish coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% |`;
            console.log(["### Backend coverage", "| Metric | Covered |", "|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx eslint --max-warnings=0 .
      - name: Test with coverage
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary
      - name: Publish coverage summary
        if: always()
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% |`;
            console.log(["### Frontend coverage", "| Metric | Covered |", "|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  e2e:
    name: End-to-end (Chromium, desktop and mobile)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results
          retention-days: 7

  database:
    name: Database (schema, migrations, RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway container: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Every root migration is linked into supabase/migrations
        run: scripts/db/sync-migrations.sh --check
      - name: Apply schema and migrations, then run RLS checks
        run: scripts/db/test.sh
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres

  database-api:
    name: Database (API against a real Supabase stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - run: npm ci
        working-directory: backend
      - name: Start Postgres, PostgREST and GoTrue, then run the API's database tests
        run: scripts/db/integration.sh
      - name: Supabase container logs
        if: failure()
        run: |
          for name in db rest auth kong; do
            echo "::group::supabase_${name}_trackit"
            docker logs "supabase_${name}_trackit" 2>&1 | tail -n 200 || true
            echo "::endgroup::"
          done

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: trackit-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: trackit-web:ci
          build-args: |
            VITE_SUPABASE_URL=https://example.supabase.co
            VITE_SUPABASE_ANON_KEY=ci-placeholder
