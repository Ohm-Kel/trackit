server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads arrive as base64 JSON; match the API's 10 MB body limit.
  client_max_body_size 11m;

  # The production build calls the API on the same origin at /api.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The service worker must be revalidated on every load, or browsers can
  # keep running an old version for up to a day. A missing file is a 404,
  # never the SPA shell.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    types { }
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve the SPA shell. Security headers
  # match vercel.json; nginx only inherits add_header into a location that
  # sets none itself, so they are repeated here rather than at server level.
  # The main Content-Security-Policy is a <meta> tag added at build time
  # (vite.config.js), because it names the Supabase project's URL.
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri $uri/ /index.html;
  }
}
