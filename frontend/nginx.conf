server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Uploads arrive as base64 JSON; match the API's 10 MB body limit.
  client_max_body_size 11m;

  # The production build calls the API on the same origin at /api.
  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routing: unknown paths serve the SPA shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
